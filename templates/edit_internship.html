<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Internship - Internship Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .form-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        .form-title {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }
        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            padding: 12px 15px;
            transition: border-color 0.3s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-submit {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
            color: white;
        }
        .btn-back {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s ease;
        }
        .btn-back:hover {
            background: #5a6268;
            color: white;
        }
        .form-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .alert {
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="form-title">Edit Internship</h2>
                <a href="{{ url_for('manage_internships') }}" class="btn btn-back">Back to Manage</a>
            </div>
            
                        
            {% if internship %}
                <form method="POST">
                    <div class="form-section">
                        <h3 class="section-title">Basic Information</h3>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="title" class="form-label">Internship Title *</label>
                                <input type="text" class="form-control" id="title" name="title" required 
                                       value="{{ internship.title }}">
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="company" class="form-label">Company Name *</label>
                                <input type="text" class="form-control" id="company" name="company" required 
                                       value="{{ internship.company }}">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="domain" class="form-label">Domain *</label>
                                <select class="form-select" id="domain" name="domain" required>
                                    <option value="">Select Domain</option>
                                    <option value="Software Development" {{ 'selected' if internship.domain == 'Software Development' }}>Software Development</option>
                                    <option value="Data Science" {{ 'selected' if internship.domain == 'Data Science' }}>Data Science</option>
                                    <option value="Machine Learning" {{ 'selected' if internship.domain == 'Machine Learning' }}>Machine Learning</option>
                                    <option value="Web Development" {{ 'selected' if internship.domain == 'Web Development' }}>Web Development</option>
                                    <option value="Mobile Development" {{ 'selected' if internship.domain == 'Mobile Development' }}>Mobile Development</option>
                                    <option value="Cloud Computing" {{ 'selected' if internship.domain == 'Cloud Computing' }}>Cloud Computing</option>
                                    <option value="DevOps" {{ 'selected' if internship.domain == 'DevOps' }}>DevOps</option>
                                    <option value="Cybersecurity" {{ 'selected' if internship.domain == 'Cybersecurity' }}>Cybersecurity</option>
                                    <option value="UI/UX Design" {{ 'selected' if internship.domain == 'UI/UX Design' }}>UI/UX Design</option>
                                    <option value="Digital Marketing" {{ 'selected' if internship.domain == 'Digital Marketing' }}>Digital Marketing</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="min_cgpa" class="form-label">Minimum CGPA *</label>
                                <input type="number" class="form-control" id="min_cgpa" name="min_cgpa" required 
                                       step="0.01" min="0" max="10" value="{{ internship.min_cgpa }}">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3 class="section-title">Requirements & Details</h3>
                        
                        <div class="mb-3">
                            <label for="required_skills" class="form-label">Required Skills *</label>
                            <input type="text" class="form-control" id="required_skills" name="required_skills" required 
                                   value="{{ internship.required_skills }}">
                            <small class="text-muted">Enter skills separated by commas</small>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="duration" class="form-label">Duration *</label>
                                <input type="text" class="form-control" id="duration" name="duration" required 
                                       value="{{ internship.duration }}">
                            </div>
                            
                            <div class="col-md-4 mb-3">
                                <label for="stipend" class="form-label">Stipend *</label>
                                <input type="text" class="form-control" id="stipend" name="stipend" required 
                                       value="{{ internship.stipend }}">
                            </div>
                            
                            <div class="col-md-4 mb-3">
                                <label for="apply_link" class="form-label">Application Link *</label>
                                <input type="url" class="form-control" id="apply_link" name="apply_link" required 
                                       value="{{ internship.apply_link }}">
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-submit">Update Internship</button>
                </form>
            {% else %}
                <div class="alert alert-danger">
                    Internship not found. <a href="{{ url_for('manage_internships') }}">Return to management</a>
                </div>
            {% endif %}
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
