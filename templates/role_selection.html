<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Role - Internship Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
        }
        .role-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 50px;
            text-align: center;
            max-width: 700px;
        }
        .role-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .role-subtitle {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 40px;
        }
        .role-buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .role-btn {
            background: white;
            border: 3px solid #667eea;
            color: #667eea;
            padding: 30px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            transition: all 0.3s ease;
            min-width: 200px;
            position: relative;
            overflow: hidden;
        }
        .role-btn:hover {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.3);
        }
        .student-section {
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid #667eea;
            border-radius: 20px;
            padding: 25px;
            min-width: 280px;
        }
        
        .role-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .role-header .role-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            display: block;
            color: #667eea;
        }
        
        .student-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option-btn {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
        }
        
        .register-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        
        .login-btn:hover {
            background: #764ba2;
            color: white;
            border-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.3);
        }
        
        .role-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="container d-flex justify-content-center align-items-center">
        <div class="role-card">
            <h1 class="role-title">Choose Your Role</h1>
            <p class="role-subtitle">Select how you'd like to use our internship platform</p>
            
            <div class="role-buttons">
                <div class="student-section">
                    <div class="role-header">
                        <span class="role-icon">Student</span>
                        <span>I'm a Student</span>
                        <small class="d-block mt-2 text-muted">Find internships</small>
                    </div>
                    <div class="student-options">
                        <a href="{{ url_for('student_register') }}" class="btn option-btn register-btn">
                            <i class="fas fa-user-plus me-2"></i>New Student? Register
                        </a>
                        <a href="{{ url_for('student_login') }}" class="btn option-btn login-btn">
                            <i class="fas fa-sign-in-alt me-2"></i>Already Registered? Login
                        </a>
                    </div>
                </div>
                
                <a href="{{ url_for('admin_login') }}" class="btn role-btn">
                    <span class="role-icon">Admin</span>
                    <span>I'm an Admin</span>
                    <small class="d-block mt-2 text-muted">Manage internships</small>
                </a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
